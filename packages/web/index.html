    <title>Market Pulse</title>
    <!--
      Inter, weights 400-700: the open substitute for GrowwSans referenced in
      styles.css. Preconnect keeps the font swap fast; the CSS fallback chain
      (system-ui, Segoe UI, Noto Sans) means a network-less machine still
      renders correctly, just in its own system face.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>

  </body>
